name: hotel_world_app
description: "Hotel World - Commercial Hospitality & Kitchen Equipment Quotation Management Mobile App"
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
